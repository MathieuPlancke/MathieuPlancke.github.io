<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Site</title>
    <style>
        /* Vos styles CSS ici */
        body {
            background-color: white;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #333;
            margin-bottom: 40px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 800px;
        }

        .card {
            background-color: #ffffff;
            border: 2px solid #ddd;
            border-radius: 10px;
            height: 180px;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: #333;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s;
        }

        .card:hover {
            border-color: black;
        }
        
        .card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
        }

        .card span {
            padding: 10px;
            text-align: center;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <h1>documents</h1>

    <div class="grid-container">
        
        <a href="tentative d'exo.pdf" target="_blank" class="card">
            <img src="accueil_exo2.png" alt="Aperçu">
            <span>Tentative d'exo (la fin est à refaire)</span>
        </a>
        <a href="DM.pdf" target="_blank" class="card">
            <img src="accueil_exo2.png" alt="Aperçu">
            <span>DM</span>
        </a>
        <a href="Exos polynomes, arcfonction, systeme.pdf" target="_blank" class="card">
            <img src="accueil_exo2.png" alt="Aperçu">
            <span>Exos en plus</span>
        </a>
    </div>

</body>
</html>
